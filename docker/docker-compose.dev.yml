services:
  php:
    container_name: ${COMPOSE_PROJECT_NAME}-php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    hostname: ${COMPOSE_PROJECT_NAME}-php
    build:
      dockerfile: ./dev/php/Dockerfile
      context: ./
      args:
        USER_ID: ${USER_ID}
    environment:
      APP_ENV: 'dev'
      PHP_IDE_CONFIG: "serverName=${COMPOSE_PROJECT_NAME}.local"
    volumes:
      - ../:/var/www/html
      - ~/.bash_aliases:/home/www-data/.bash_aliases:rw
      - ~/.bash_history:/home/www-data/.bash_history:rw
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    hostname: ${COMPOSE_PROJECT_NAME}-nginx
    build:
      context: ./dev/nginx
    depends_on:
      - php
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ../:/var/www/html/
      - ${DATA_PATH_HOST}/log/nginx:/var/log/nginx/
  mysql:
    image: mysql:8.0.31
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    hostname: ${COMPOSE_PROJECT_NAME}-mysql
    environment:
      MYSQL_DATABASE: ${COMPOSE_PROJECT_NAME}_dev
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${DATA_PATH_HOST}/mysql:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      retries: 5
      start_period: 10s
